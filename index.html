    <title>PURELIS | Clean Beauty & Home Essentials</title>
    <meta name="description" content="Naturally pure, clean, effective skincare and modern home kitchen essentials crafted with nature's finest ingredients." />
    <script>
      // Sandboxed environment compatibility for window.fetch assignment
      try {
        const _origFetch = window.fetch;
        let _activeFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _activeFetch || _origFetch; },
          set: function(val) { _activeFetch = val; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        // window.fetch already configured or defined
      }
    </script>
